server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # 1. Giao diện Web tĩnh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse proxy chuyển tiếp các lệnh API sang FastAPI
    location /api/ {
        proxy_pass http://backend_api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Phục vụ tải Firmware OTA cho ESP32
    location /firmware/ {
        proxy_pass http://backend_api:8000/firmware/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Chuyển tiếp Swagger UI & OpenAPI schema
    location /docs {
        proxy_pass http://backend_api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://backend_api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
